<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crossplay Board Analyzer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 20px; }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; color: #fff; }
  .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .input-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .input-row input { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid #333; border-radius: 6px; background: #16213e; color: #e0e0e0; font-size: 0.95rem; }
  .input-row input:focus { outline: none; border-color: #4a6fa5; }
  button { padding: 10px 20px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
  #analyzeBtn { background: #4a6fa5; color: #fff; }
  #analyzeBtn:hover { background: #5a7fb5; }
  #analyzeBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .key-row { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .key-row input { width: 340px; padding: 10px 14px; border: 1px solid #333; border-radius: 6px; background: #16213e; color: #e0e0e0; font-size: 0.95rem; font-family: monospace; }
  .key-row label { font-size: 0.85rem; color: #888; }
  .key-row .save-btn { background: #2d4a22; color: #afd89a; padding: 6px 14px; font-size: 0.8rem; }
  .stats { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 12px 20px; min-width: 120px; text-align: center; }
  .stat .val { font-size: 1.5rem; font-weight: 700; color: #fff; }
  .stat .lbl { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .content { display: flex; gap: 20px; flex-wrap: wrap; }
  .board-wrap { flex: 1; min-width: 300px; }
  .words-wrap { width: 260px; flex-shrink: 0; }
  table.board { border-collapse: collapse; font-family: 'Courier New', monospace; font-size: 14px; }
  table.board th, table.board td { width: 28px; height: 28px; text-align: center; border: 1px solid #333; padding: 0; }
  table.board th { background: #16213e; color: #888; font-size: 11px; font-weight: 400; }
  table.board td.tile { background: #2980b9; color: #fff; font-weight: 700; }
  table.board td.blank-tile { background: #2980b9; color: #f0d060; font-weight: 700; font-style: italic; }
  table.board td.empty { background: #1e2d4a; color: #555; font-size: 9px; }
  table.board td.center { background: #2d1e4a; }
  .words-wrap h3 { font-size: 1rem; margin-bottom: 8px; color: #fff; }
  .word-list { max-height: 500px; overflow-y: auto; }
  .word-list table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .word-list th, .word-list td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #222; }
  .word-list th { color: #888; font-weight: 400; }
  .word-list td { color: #e0e0e0; }
  #status { margin-bottom: 12px; font-size: 0.9rem; color: #888; }
  #status.error { color: #e74c3c; }
  #status.loading { color: #f39c12; }
  #status.done { color: #2ecc71; }
  .drop-zone { border: 2px dashed #333; border-radius: 8px; padding: 20px; text-align: center; color: #555; font-size: 0.85rem; margin-bottom: 16px; transition: border-color 0.2s; }
  .drop-zone.drag-over { border-color: #4a6fa5; color: #4a6fa5; }
  .hidden { display: none; }
  .model-select { display: flex; align-items: center; gap: 8px; }
  .model-select select { padding: 10px; border: 1px solid #333; border-radius: 6px; background: #16213e; color: #e0e0e0; font-size: 0.95rem; }
  #kibitzBtn { background: #8e44ad; color: #fff; margin-top: 12px; }
  #kibitzBtn:hover { background: #9b59b6; }
  #kibitzBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .moves-wrap { width: 340px; flex-shrink: 0; }
  .moves-wrap h3 { font-size: 1rem; margin-bottom: 8px; color: #fff; }
  .moves-list { max-height: 500px; overflow-y: auto; }
  .moves-list table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .moves-list th, .moves-list td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #222; }
  .moves-list th { color: #888; font-weight: 400; }
  .moves-list td { color: #e0e0e0; }
  .moves-list tr:first-child td { color: #2ecc71; font-weight: 700; }
  #engineStatus { font-size: 0.8rem; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>Crossplay Board Analyzer</h1>
  <p class="subtitle">Paste a screenshot URL or drop an image to parse the board and find all words.</p>

  <div class="key-row">
    <label>OpenAI API Key:</label>
    <input type="password" id="apiKeyInput" placeholder="sk-..." />
    <button class="save-btn" onclick="saveKey()">Save</button>
    <label style="font-size:0.75rem;color:#555;">Stored in your browser only.</label>
  </div>

  <div class="input-row">
    <input type="text" id="imageUrlInput" placeholder="Paste image URL (imgur, etc.)" />
    <div class="model-select">
      <select id="modelSelect">
        <option value="gpt-4o">GPT-4o (recommended)</option>
        <option value="gpt-4o-mini">GPT-4o Mini (fast, cheap)</option>
      </select>
    </div>
    <button id="analyzeBtn" onclick="analyze()">Analyze Board</button>
  </div>

  <div class="drop-zone" id="dropZone">
    Or drag & drop / paste (Ctrl+V) a screenshot here
  </div>

  <div id="status"></div>

  <div class="stats hidden" id="statsRow">
    <div class="stat"><div class="val" id="p1Score">--</div><div class="lbl" id="p1Name">Player 1</div></div>
    <div class="stat"><div class="val" id="p2Score">--</div><div class="lbl" id="p2Name">Player 2</div></div>
    <div class="stat"><div class="val" id="rackDisplay">--</div><div class="lbl">Your Rack</div></div>
    <div class="stat"><div class="val" id="tileCount">--</div><div class="lbl">Tiles on Board</div></div>
  </div>

  <div class="content hidden" id="contentRow">
    <div class="board-wrap" id="boardContainer"></div>
    <div class="words-wrap" id="wordsContainer"></div>
    <div class="moves-wrap hidden" id="movesContainer"></div>
  </div>

  <button id="kibitzBtn" class="hidden" onclick="findBestMoves()">Find Best Moves (Quackle Engine)</button>
  <div id="engineStatus"></div>
</div>

<script>
// ── API Key persistence ───────────────────────────────────────────────────
const apiKeyInput = document.getElementById('apiKeyInput');
const saved = localStorage.getItem('openai_api_key');
if (saved) apiKeyInput.value = saved;

function saveKey() {
  localStorage.setItem('openai_api_key', apiKeyInput.value.trim());
  setStatus('Key saved.', 'done');
}

function getKey() {
  const k = apiKeyInput.value.trim();
  if (k) localStorage.setItem('openai_api_key', k);
  return k;
}

// ── Status ────────────────────────────────────────────────────────────────
function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

// ── Image drop/paste → base64 ─────────────────────────────────────────────
let base64Image = null;

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadFile(file);
});

document.addEventListener('paste', e => {
  const items = e.clipboardData.items;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      loadFile(item.getAsFile());
      return;
    }
  }
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    base64Image = { data: reader.result.split(',')[1], media_type: file.type };
    document.getElementById('imageUrlInput').value = '';
    dropZone.textContent = 'Image loaded: ' + file.name + ' (' + Math.round(file.size/1024) + ' KB)';
    setStatus('Image ready. Click Analyze Board.', 'done');
  };
  reader.readAsDataURL(file);
}

// ── Hybrid CV+API Board Parsing ───────────────────────────────────────────

function rgbToHsv(r, g, b) {
  // Returns [H, S, V] in OpenCV convention: H=[0,179], S=[0,255], V=[0,255]
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0, s = max === 0 ? 0 : (d / max) * 255, v = max * 255;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 30;
    else if (max === g) h = ((b - r) / d + 2) * 30;
    else h = ((r - g) / d + 4) * 30;
  }
  return [Math.round(h), Math.round(s), Math.round(v)];
}

function isBlueHsv(h, s, v) {
  return h >= 95 && h <= 135 && s >= 30 && v >= 80;
}

function detectBoardGrid(imageData, width, height) {
  // Width prior: board spans ~96% of image width, centered
  const BOARD_WIDTH_FRAC = 0.96;
  const cellW = width * BOARD_WIDTH_FRAC / 15;
  const cellH = cellW; // square cells
  const gridLeft = (width - 15 * cellW) / 2;

  // Search band: 30%-70% of height for blue pixels
  const searchTop = Math.floor(height * 0.30);
  const searchBottom = Math.floor(height * 0.70);

  // Build y-profile of blue pixel density
  const yProfile = new Float32Array(searchBottom - searchTop);
  for (let y = searchTop; y < searchBottom; y++) {
    let blueCount = 0;
    for (let x = 0; x < width; x++) {
      const idx = (y * width + x) * 4;
      const [h, s, v] = rgbToHsv(imageData[idx], imageData[idx+1], imageData[idx+2]);
      if (h >= 95 && h <= 135 && s >= 80 && v >= 80) blueCount++;
    }
    yProfile[y - searchTop] = blueCount;
  }

  // Find first row with significant blue content (>10% of width)
  const tileRowThresh = width * 0.10;
  let firstTileY = -1;
  for (let i = 0; i < yProfile.length; i++) {
    if (yProfile[i] > tileRowThresh) {
      firstTileY = i + searchTop;
      break;
    }
  }

  if (firstTileY < 0) {
    // Fallback: no blue pixels found
    console.warn('No blue tiles found, using fallback grid');
    return fallbackGrid(width, height);
  }

  // Snap grid top: try each possible row offset, pick closest to h*0.29
  const gridTopMin = height * 0.15;
  const gridTopMax = height * 0.32;
  const expectedBoardTop = height * 0.29;
  let bestGridTop = null;
  let bestDist = Infinity;

  for (let offset = 0; offset < 15; offset++) {
    const gridTop = firstTileY - offset * cellH;
    if (gridTop < gridTopMin || gridTop > gridTopMax) continue;
    const dist = Math.abs(gridTop - expectedBoardTop);
    if (dist < bestDist) {
      bestDist = dist;
      bestGridTop = gridTop;
    }
  }

  if (bestGridTop === null) bestGridTop = height * 0.20;

  // Generate grid lines
  const hGrid = [], vGrid = [];
  for (let i = 0; i <= 15; i++) {
    hGrid.push(Math.max(0, Math.min(height - 1, Math.round(bestGridTop + i * cellH))));
    vGrid.push(Math.max(0, Math.min(width - 1, Math.round(gridLeft + i * cellW))));
  }

  return { hGrid, vGrid, cellW, cellH };
}

function fallbackGrid(w, h) {
  const boardLeft = Math.round(w * 0.04);
  const boardTop = Math.round(h * 0.28);
  const cellW = (w * 0.92) / 15;
  const cellH = ((h * 0.70 - h * 0.28)) / 15;
  const hGrid = [], vGrid = [];
  for (let i = 0; i <= 15; i++) {
    hGrid.push(Math.round(boardTop + i * cellH));
    vGrid.push(Math.round(boardLeft + i * cellW));
  }
  return { hGrid, vGrid, cellW, cellH };
}

function isTileCell(imageData, width, x1, y1, x2, y2) {
  // Sample pixels with 8% margin inset
  const marginX = Math.max(2, Math.round((x2 - x1) * 0.08));
  const marginY = Math.max(2, Math.round((y2 - y1) * 0.08));
  const sx1 = x1 + marginX, sy1 = y1 + marginY;
  const sx2 = x2 - marginX, sy2 = y2 - marginY;
  if (sx2 <= sx1 || sy2 <= sy1) return false;

  const cellW = sx2 - sx1;
  const cellH = sy2 - sy1;
  let blueCount = 0, totalCount = 0;
  const colHasBlue = new Uint8Array(cellW);

  for (let y = sy1; y < sy2; y++) {
    for (let x = sx1; x < sx2; x++) {
      const idx = (y * width + x) * 4;
      const [h, s, v] = rgbToHsv(imageData[idx], imageData[idx+1], imageData[idx+2]);
      totalCount++;
      if (isBlueHsv(h, s, v)) {
        blueCount++;
        colHasBlue[x - sx1] = 1;
      }
    }
  }

  const blueRatio = blueCount / totalCount;
  if (blueRatio <= 0.25) return false;

  // Check that blue spans at least 35% of cell width
  let denseColCount = 0;
  for (let c = 0; c < cellW; c++) {
    // Count pixels in this column that are blue
    let colBlue = 0;
    for (let y = sy1; y < sy2; y++) {
      const idx = (y * width + (sx1 + c)) * 4;
      const [h, s, v] = rgbToHsv(imageData[idx], imageData[idx+1], imageData[idx+2]);
      if (isBlueHsv(h, s, v)) colBlue++;
    }
    if (colBlue > cellH * 0.10) denseColCount++;
  }

  return (denseColCount / cellW) >= 0.35;
}

function buildTileMosaic(canvas, grid, tilePositions) {
  // Build a labeled mosaic of all detected tiles
  const cellSize = 60;
  const labelHeight = 18;
  const padding = 2;
  const colsPerRow = 10;
  const nTiles = tilePositions.length;
  const nRows = Math.ceil(nTiles / colsPerRow);

  const mosaicW = colsPerRow * (cellSize + padding) + padding;
  const mosaicH = nRows * (cellSize + padding + labelHeight) + padding;

  const mosaicCanvas = document.createElement('canvas');
  mosaicCanvas.width = mosaicW;
  mosaicCanvas.height = mosaicH;
  const mctx = mosaicCanvas.getContext('2d');
  mctx.fillStyle = '#000';
  mctx.fillRect(0, 0, mosaicW, mosaicH);

  const srcCtx = canvas.getContext('2d');

  for (let idx = 0; idx < nTiles; idx++) {
    const { row, col, x1, y1, x2, y2 } = tilePositions[idx];
    const gridR = Math.floor(idx / colsPerRow);
    const gridC = idx % colsPerRow;
    const dx = gridC * (cellSize + padding) + padding;
    const dy = gridR * (cellSize + padding + labelHeight) + padding;

    // Draw the cropped tile
    const srcW = x2 - x1, srcH = y2 - y1;
    mctx.drawImage(canvas, x1, y1, srcW, srcH, dx, dy, cellSize, cellSize);

    // Draw position label
    const label = `${row + 1}${String.fromCharCode(65 + col)}`;
    mctx.fillStyle = '#fff';
    mctx.font = '12px sans-serif';
    mctx.fillText(label, dx + 2, dy + cellSize + 14);
  }

  return mosaicCanvas;
}

async function detectRackTiles(canvas, imageData, width, height, gridBottom) {
  // Detect rack tiles below the board
  const cellHApprox = (gridBottom - height * 0.29) / 15;
  const rackTop = Math.floor(gridBottom + cellHApprox * 0.5);
  const rackBottom = Math.floor(height * 0.95);
  if (rackBottom <= rackTop) return [];

  const rackTiles = [];

  // Find blue tile clusters in the rack region
  // Scan for contiguous blue regions
  const minTileSize = Math.floor(width / 30);
  const maxTileSize = Math.floor(width / 6);

  // Simple approach: scan columns for blue density
  const colBlue = new Float32Array(width);
  for (let x = 0; x < width; x++) {
    let blueCount = 0;
    for (let y = rackTop; y < rackBottom; y++) {
      const idx = (y * width + x) * 4;
      const [h, s, v] = rgbToHsv(imageData[idx], imageData[idx+1], imageData[idx+2]);
      if (h >= 95 && h <= 140 && s >= 30 && v >= 50) blueCount++;
    }
    colBlue[x] = blueCount;
  }

  // Find runs of columns with significant blue
  const threshold = (rackBottom - rackTop) * 0.15;
  let inTile = false, tileStart = 0;
  const tileRuns = [];
  for (let x = 0; x < width; x++) {
    if (colBlue[x] > threshold) {
      if (!inTile) { inTile = true; tileStart = x; }
    } else {
      if (inTile) {
        const w = x - tileStart;
        if (w > minTileSize && w < maxTileSize) {
          tileRuns.push({ x1: tileStart, x2: x });
        }
        inTile = false;
      }
    }
  }
  if (inTile) {
    const w = width - tileStart;
    if (w > minTileSize && w < maxTileSize) {
      tileRuns.push({ x1: tileStart, x2: width });
    }
  }

  // For each run, find vertical bounds
  for (const run of tileRuns) {
    let minY = rackBottom, maxY = rackTop;
    for (let y = rackTop; y < rackBottom; y++) {
      for (let x = run.x1; x < run.x2; x++) {
        const idx = (y * width + x) * 4;
        const [h, s, v] = rgbToHsv(imageData[idx], imageData[idx+1], imageData[idx+2]);
        if (h >= 95 && h <= 140 && s >= 30 && v >= 50) {
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    const h = maxY - minY;
    if (h > minTileSize && h < maxTileSize) {
      rackTiles.push({ x1: run.x1, y1: minY, x2: run.x2, y2: maxY + 1 });
    }
  }

  return rackTiles;
}

async function analyzeHybrid(imageSource) {
  // imageSource: either { url: string } or { dataUrl: string }
  // Returns parsed board object or null if hybrid detection fails

  setStatus('Loading image for CV analysis...', 'loading');

  // Step 1: Load image onto canvas
  const img = new Image();
  img.crossOrigin = 'anonymous';
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = () => reject(new Error('Failed to load image'));
    if (imageSource.dataUrl) img.src = imageSource.dataUrl;
    else img.src = imageSource.url;
  });

  const cvCanvas = document.createElement('canvas');
  cvCanvas.width = img.naturalWidth;
  cvCanvas.height = img.naturalHeight;
  const ctx = cvCanvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const w = cvCanvas.width, h = cvCanvas.height;
  const idata = ctx.getImageData(0, 0, w, h);
  const pixels = idata.data;

  setStatus(`Image loaded (${w}x${h}). Detecting grid...`, 'loading');

  // Step 2-3: Detect board grid
  const grid = detectBoardGrid(pixels, w, h);
  console.log('Grid detected:', grid);

  // Step 4: Detect tiles in each cell
  const tilePositions = [];
  for (let row = 0; row < 15; row++) {
    for (let col = 0; col < 15; col++) {
      const y1 = grid.hGrid[row], y2 = grid.hGrid[row + 1];
      const x1 = grid.vGrid[col], x2 = grid.vGrid[col + 1];
      if (isTileCell(pixels, w, x1, y1, x2, y2)) {
        tilePositions.push({ row, col, x1, y1, x2, y2 });
      }
    }
  }

  console.log(`Detected ${tilePositions.length} tiles on board`);

  if (tilePositions.length === 0) {
    console.warn('No tiles detected, falling back to full-board API');
    return null;
  }

  setStatus(`Found ${tilePositions.length} tiles. Building mosaic...`, 'loading');

  // Step 5: Build labeled tile mosaic (board tiles)
  const mosaicCanvas = buildTileMosaic(cvCanvas, grid, tilePositions);

  // Also detect rack tiles
  const rackTileBoxes = await detectRackTiles(cvCanvas, pixels, w, h, grid.hGrid[15]);
  let rackMosaicCanvas = null;
  if (rackTileBoxes.length > 0) {
    const rackPositions = rackTileBoxes.map((box, i) => ({
      row: -1, col: i, x1: box.x1, y1: box.y1, x2: box.x2, y2: box.y2
    }));

    // Build a separate rack mosaic with "R1", "R2" labels
    const rCellSize = 60;
    const rPad = 2;
    const rLabelH = 18;
    const rW = rackPositions.length * (rCellSize + rPad) + rPad;
    const rH = rCellSize + rLabelH + rPad * 2;
    rackMosaicCanvas = document.createElement('canvas');
    rackMosaicCanvas.width = rW;
    rackMosaicCanvas.height = rH;
    const rctx = rackMosaicCanvas.getContext('2d');
    rctx.fillStyle = '#000';
    rctx.fillRect(0, 0, rW, rH);
    for (let i = 0; i < rackPositions.length; i++) {
      const rp = rackPositions[i];
      const dx = i * (rCellSize + rPad) + rPad;
      rctx.drawImage(cvCanvas, rp.x1, rp.y1, rp.x2 - rp.x1, rp.y2 - rp.y1, dx, rPad, rCellSize, rCellSize);
      rctx.fillStyle = '#fff';
      rctx.font = '12px sans-serif';
      rctx.fillText(`R${i + 1}`, dx + 2, rPad + rCellSize + 14);
    }
  }

  // Step 6: Combine mosaics and send to GPT-4o for letter OCR
  // Stitch board mosaic + rack mosaic into one image
  let combinedCanvas = mosaicCanvas;
  if (rackMosaicCanvas) {
    const cW = Math.max(mosaicCanvas.width, rackMosaicCanvas.width);
    const cH = mosaicCanvas.height + 20 + rackMosaicCanvas.height;
    combinedCanvas = document.createElement('canvas');
    combinedCanvas.width = cW;
    combinedCanvas.height = cH;
    const cctx = combinedCanvas.getContext('2d');
    cctx.fillStyle = '#000';
    cctx.fillRect(0, 0, cW, cH);
    cctx.drawImage(mosaicCanvas, 0, 0);
    // Label
    cctx.fillStyle = '#ff0';
    cctx.font = 'bold 14px sans-serif';
    cctx.fillText('RACK:', 2, mosaicCanvas.height + 14);
    cctx.drawImage(rackMosaicCanvas, 0, mosaicCanvas.height + 20);
  }

  const mosaicDataUrl = combinedCanvas.toDataURL('image/png');

  // Build position list for prompt
  const boardPosLabels = tilePositions.map(t => `${t.row + 1}${String.fromCharCode(65 + t.col)}`);
  const rackPosLabels = rackTileBoxes.map((_, i) => `R${i + 1}`);
  const allLabels = [...boardPosLabels, ...rackPosLabels];

  setStatus(`Sending ${allLabels.length} tile mosaic to GPT-4o for letter recognition...`, 'loading');

  const key = getKey();
  if (!key) { setStatus('API key required for letter recognition.', 'error'); return null; }

  const model = document.getElementById('modelSelect').value;

  const letterPrompt = `This image shows ${allLabels.length} Crossplay/Scrabble tiles arranged in a grid mosaic.
Each tile is a blue square with a white letter and a small superscript number (point value).
Below each tile is a position label.

Board tile labels use format "RowCol" (e.g. "5H" = row 5, column H).
Rack tile labels use format "R1", "R2", etc.

For each tile, read the single letter (A-Z) on it.
If the superscript number is 0, it is a BLANK tile — use lowercase for blanks.

Output ONLY a JSON object mapping each label to its letter.
Example: {"5H": "M", "8A": "G", "R1": "W", "R2": "l"}`;

  const body = {
    model,
    max_tokens: 2048,
    response_format: { type: 'json_object' },
    messages: [
      { role: 'system', content: 'You read letters from individual Scrabble tile images. Output only JSON.' },
      {
        role: 'user',
        content: [
          { type: 'image_url', image_url: { url: mosaicDataUrl } },
          { type: 'text', text: letterPrompt }
        ]
      }
    ]
  };

  const resp = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
    body: JSON.stringify(body)
  });

  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`API ${resp.status}: ${errText.substring(0, 200)}`);
  }

  const data = await resp.json();
  const letterMap = JSON.parse(data.choices[0].message.content);
  console.log('Letter map from API:', letterMap);

  // Step 7: Assemble grid
  const boardGrid = Array(15).fill(null).map(() => '.'.repeat(15).split(''));
  let missedTiles = 0;

  for (const tp of tilePositions) {
    const label = `${tp.row + 1}${String.fromCharCode(65 + tp.col)}`;
    const letter = letterMap[label];
    if (letter && letter.length === 1 && /[A-Za-z]/.test(letter)) {
      boardGrid[tp.row][tp.col] = letter;
    } else {
      boardGrid[tp.row][tp.col] = '?';
      missedTiles++;
    }
  }

  // Build rack string
  let rack = '';
  for (let i = 0; i < rackTileBoxes.length; i++) {
    const label = `R${i + 1}`;
    const letter = letterMap[label];
    if (letter && letter.length === 1 && /[A-Za-z]/.test(letter)) {
      rack += letter.toUpperCase();
    } else {
      rack += '?';
    }
  }

  const gridStrings = boardGrid.map(row => row.join(''));

  setStatus(`Hybrid parsing complete: ${tilePositions.length} tiles, ${missedTiles} unrecognized.`, 'done');

  return {
    grid: gridStrings,
    rack: rack || '?',
    player_score: 0,
    opponent_score: 0,
    player_name: 'You',
    opponent_name: 'Opponent'
  };
}

// ── System prompt (anti-hallucination) ────────────────────────────────────
const SYSTEM_PROMPT = "You are a precise Scrabble board OCR system. You output exactly one JSON object. CRITICAL RULES: (1) TILES are ONLY the solid BLUE squares with white letters — ignore all premium labels (3W, 3L, 2W, 2L), the center star, and empty squares. (2) Each grid cell is exactly one character: a letter A-Z or '.'. No digits ever. (3) You MUST think step-by-step: first identify each word on the board and its exact starting position, then build the grid from those positions.";

// ── Vision prompt ─────────────────────────────────────────────────────────

STEP 1 — IDENTIFY TILES:
The board is 15x15. Columns A-O (left to right), Rows 1-15 (top to bottom).
TILES = solid BLUE squares with a WHITE letter and small superscript number.
IGNORE everything else: premium labels (3W, 3L, 2W, 2L), empty squares, center star.

STEP 2 — LOCATE EACH WORD:

Use these landmarks to count positions:

STEP 3 — BUILD THE GRID:

// ── Analyze (Hybrid CV+API first, fallback to full-board vision) ─────────
async function analyze() {
  const key = getKey();
  if (!key) { setStatus('Enter your OpenAI API key first.', 'error'); return; }

  const imageUrl = document.getElementById('imageUrlInput').value.trim();
  if (!imageUrl && !base64Image) { setStatus('Provide an image URL or drop an image.', 'error'); return; }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;

  try {
    // Try hybrid CV+API approach first
    const imageSource = base64Image
      ? { dataUrl: `data:${base64Image.media_type};base64,${base64Image.data}` }
      : { url: imageUrl };

    let parsed = null;
    try {
      parsed = await analyzeHybrid(imageSource);
    } catch (e) {
      console.warn('Hybrid parsing failed, falling back:', e.message);
    }

    if (parsed) {
      // Hybrid succeeded — also try to extract scores via a quick API call
      try {
        const scoreParsed = await extractScoresOnly(imageSource);
        if (scoreParsed) {
          parsed.player_score = scoreParsed.player_score || 0;
          parsed.opponent_score = scoreParsed.opponent_score || 0;
          parsed.player_name = scoreParsed.player_name || 'You';
          parsed.opponent_name = scoreParsed.opponent_name || 'Opponent';
        }
      } catch (e) {
        console.warn('Score extraction failed:', e.message);
      }
      renderResult(parsed);
      return;
    }

    // Fallback: full-board GPT-4o vision
    setStatus('Hybrid failed — using full-board vision (less accurate)...', 'loading');
    await analyzeFullBoard(imageUrl);

  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

async function extractScoresOnly(imageSource) {
  const key = getKey();
  const model = document.getElementById('modelSelect').value;
  const imageContent = imageSource.dataUrl
    ? { type: 'image_url', image_url: { url: imageSource.dataUrl } }
    : { type: 'image_url', image_url: { url: imageSource.url } };

  const body = {
    model, max_tokens: 256,
    response_format: { type: 'json_object' },
    messages: [{
      role: 'user',
      content: [
        imageContent,
        { type: 'text', text: 'Read ONLY the player names and scores from this Crossplay screenshot. Output JSON: {"player_name":"...","player_score":N,"opponent_name":"...","opponent_score":N}' }
      ]
    }]
  };

  const resp = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
    body: JSON.stringify(body)
  });
  if (!resp.ok) return null;
  const data = await resp.json();
  return JSON.parse(data.choices[0].message.content);
}

async function analyzeFullBoard(imageUrl) {
  setStatus('Analyzing with full-board vision... (takes ~15-30s)', 'loading');

  const key = getKey();
  const imageContent = base64Image
    ? { type: 'image_url', image_url: { url: `data:${base64Image.media_type};base64,${base64Image.data}` } }
    : { type: 'image_url', image_url: { url: imageUrl } };

  const model = document.getElementById('modelSelect').value;

  const body = {
    model: model,
    max_tokens: 4096,
    response_format: { type: 'json_object' },
    messages: [
      { role: 'system', content: SYSTEM_PROMPT },
      {
        role: 'user',
        content: [ imageContent, { type: 'text', text: VISION_PROMPT } ]
      }
    ]
  };

  const resp = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${key}`
    },
    body: JSON.stringify(body)
  });

  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`API ${resp.status}: ${errText.substring(0, 200)}`);
  }

  const data = await resp.json();
  const text = data.choices[0].message.content;

  const parsed = JSON.parse(text);
  if (parsed.grid) {
    parsed.grid = sanitizeGrid(parsed.grid);
  }
  renderResult(parsed);
  setStatus('Done (fallback mode). ' + (parsed.grid ? parsed.grid.filter(r => r.replace(/\./g,'').length > 0).length + ' rows with tiles.' : ''), 'done');
}

// ── Grid sanitization (strip premium square garbage) ─────────────────────
function sanitizeGrid(grid) {
  if (!Array.isArray(grid)) {
    console.warn('[sanitizeGrid] grid is not an array, returning empty 15x15');
    return Array(15).fill('...............');
  }

  let totalFixed = 0;
  const cleaned = [];

  for (let r = 0; r < 15; r++) {
    let row = (grid[r] || '').replace(/\s/g, '');

    // Strip multi-char premium labels that GPT may have inserted as cell values.
    // E.g. "3W" "2L" "3L" "2W" appearing in the row text — replace with "."
    row = row.replace(/[23][WwLl]/g, '.');

    // Now enforce: each character must be [A-Za-z.], replace anything else with "."
    let sanitized = '';
    for (let i = 0; i < row.length; i++) {
      const ch = row[i];
      if (/^[A-Za-z.]$/.test(ch)) {
        sanitized += ch;
      } else {
        sanitized += '.';
        totalFixed++;
      }
    }

    // Pad or truncate to exactly 15 characters
    if (sanitized.length < 15) {
      const padCount = 15 - sanitized.length;
      if (padCount > 0) {
        console.warn(`[sanitizeGrid] Row ${r + 1} too short (${sanitized.length} chars), padding with '.'`);
        totalFixed += padCount;
      }
      sanitized = sanitized.padEnd(15, '.');
    } else if (sanitized.length > 15) {
      console.warn(`[sanitizeGrid] Row ${r + 1} too long (${sanitized.length} chars), truncating`);
      sanitized = sanitized.substring(0, 15);
    }

    cleaned.push(sanitized);
  }

  if (totalFixed > 0) {
    console.warn(`[sanitizeGrid] Fixed ${totalFixed} invalid character(s) in grid. Premium square labels or digits were stripped.`);
  }

  return cleaned;
}

// ── Parse & render ────────────────────────────────────────────────────────
function renderResult(parsed) {
  // Build tile list from grid
  const grid = parsed.grid || [];
  const tiles = [];
  const cols = 'ABCDEFGHIJKLMNO';
  for (let r = 0; r < grid.length && r < 15; r++) {
    const line = grid[r] || '';
    for (let c = 0; c < 15 && c < line.length; c++) {
      const ch = line[c];
      if (ch !== '.') {
        tiles.push({ letter: ch.toUpperCase(), row: r, col: c, blank: ch === ch.toLowerCase() && ch !== ch.toUpperCase() });
      }
    }
  }

  // Stats
  document.getElementById('p1Score').textContent = parsed.player_score || '--';
  document.getElementById('p1Name').textContent = parsed.player_name || 'Player 1';
  document.getElementById('p2Score').textContent = parsed.opponent_score || '--';
  document.getElementById('p2Name').textContent = parsed.opponent_name || 'Player 2';
  document.getElementById('rackDisplay').textContent = parsed.rack || '--';
  document.getElementById('tileCount').textContent = tiles.length;
  document.getElementById('statsRow').classList.remove('hidden');

  // Board table
  const board = [];
  for (let r = 0; r < 15; r++) board.push(new Array(15).fill(null));
  for (const t of tiles) board[t.row][t.col] = t;

  let html = '<table class="board"><tr><th></th>';
  for (const c of cols) html += `<th>${c}</th>`;
  html += '</tr>';
  for (let r = 0; r < 15; r++) {
    html += `<tr><th>${r + 1}</th>`;
    for (let c = 0; c < 15; c++) {
      const t = board[r][c];
      if (t) {
        const cls = t.blank ? 'blank-tile' : 'tile';
        html += `<td class="${cls}">${t.letter}</td>`;
      } else {
        const isCenter = r === 7 && c === 7;
        html += `<td class="empty${isCenter ? ' center' : ''}">${isCenter ? '\u2605' : ''}</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('boardContainer').innerHTML = html;

  // Find words
  const words = [];
  const g = [];
  for (let r = 0; r < 15; r++) {
    g.push([]);
    for (let c = 0; c < 15; c++) g[r].push(board[r][c] ? board[r][c].letter : '.');
  }

  // Across
  for (let r = 0; r < 15; r++) {
    let c = 0;
    while (c < 15) {
      if (g[r][c] !== '.') {
        const s = c; let w = '';
        while (c < 15 && g[r][c] !== '.') { w += g[r][c]; c++; }
        if (w.length >= 2) words.push({ pos: `${r+1}${cols[s]}`, word: w, dir: 'across' });
      } else c++;
    }
  }
  // Down
  for (let c = 0; c < 15; c++) {
    let r = 0;
    while (r < 15) {
      if (g[r][c] !== '.') {
        const s = r; let w = '';
        while (r < 15 && g[r][c] !== '.') { w += g[r][c]; r++; }
        if (w.length >= 2) words.push({ pos: `${cols[c]}${s+1}`, word: w, dir: 'down' });
      } else r++;
    }
  }

  let whtml = `<h3>Words Found (${words.length})</h3><div class="word-list"><table><tr><th>Pos</th><th>Word</th><th>Dir</th></tr>`;
  for (const w of words) whtml += `<tr><td>${w.pos}</td><td><b>${w.word}</b></td><td>${w.dir}</td></tr>`;
  whtml += '</table></div>';
  document.getElementById('wordsContainer').innerHTML = whtml;
  document.getElementById('contentRow').classList.remove('hidden');

  // Show kibitz button if we have a rack
  if (parsed.rack && parsed.rack.length > 0) {
    document.getElementById('kibitzBtn').classList.remove('hidden');
    lastParsed = parsed;
  }
}

// ── Quackle WASM Engine ─────────────────────────────────────────────────
let quackleModule = null;
let quackleReady = false;
let lastParsed = null;

async function loadQuackleEngine() {
  if (quackleReady) return true;

  const statusEl = document.getElementById('engineStatus');
  statusEl.textContent = 'Loading Quackle engine (~27MB dictionary download)...';

  try {
    // Load the WASM module
    const script = document.createElement('script');
    script.src = 'quackle.js';
    await new Promise((resolve, reject) => {
      script.onload = resolve;
      script.onerror = () => reject(new Error('Failed to load quackle.js'));
      document.head.appendChild(script);
    });

    // Initialize the module
    quackleModule = await QuackleModule();
    statusEl.textContent = 'Initializing engine...';

    // Initialize with the virtual filesystem data directory
    const ok = quackleModule.initEngine('/data');
    if (!ok) {
      statusEl.textContent = 'Engine initialization failed (check console)';
      return false;
    }

    const info = quackleModule.getEngineInfo();
    statusEl.textContent = 'Engine ready. ' + info.replace(/\n/g, ' | ');
    quackleReady = true;
    return true;
  } catch (e) {
    statusEl.textContent = 'Engine load failed: ' + e.message;
    console.error('Quackle WASM error:', e);
    return false;
  }
}

async function findBestMoves() {
  const btn = document.getElementById('kibitzBtn');
  btn.disabled = true;
  btn.textContent = 'Loading engine...';

  const ready = await loadQuackleEngine();
  if (!ready) {
    btn.disabled = false;
    btn.textContent = 'Find Best Moves (Quackle Engine)';
    return;
  }

  if (!lastParsed || !lastParsed.grid) {
    document.getElementById('engineStatus').textContent = 'No board data. Analyze a board first.';
    btn.disabled = false;
    btn.textContent = 'Find Best Moves (Quackle Engine)';
    return;
  }

  btn.textContent = 'Generating moves...';
  document.getElementById('engineStatus').textContent = 'Running kibitz (move generation)...';

  // Small delay to let UI update
  await new Promise(r => setTimeout(r, 50));

  const gridJson = JSON.stringify(lastParsed.grid);
  const rack = lastParsed.rack || '';
  const pScore = lastParsed.player_score || 0;
  const oScore = lastParsed.opponent_score || 0;

  const result = quackleModule.kibitz(gridJson, rack, pScore, oScore, 15);

  if (result.error) {
    document.getElementById('engineStatus').textContent = 'Error: ' + result.error;
  } else {
    renderMoves(result.moves);
    document.getElementById('engineStatus').textContent = `Found ${result.moves.length} moves.`;
  }

  btn.disabled = false;
  btn.textContent = 'Find Best Moves (Quackle Engine)';
}

function renderMoves(moves) {
  const container = document.getElementById('movesContainer');
  container.classList.remove('hidden');

  let html = `<h3>Best Moves (${moves.length})</h3><div class="moves-list"><table>`;
  html += '<tr><th>Move</th><th>Score</th><th>Leave</th><th>Win%</th><th>Valuation</th></tr>';

  for (let i = 0; i < moves.length; i++) {
    const m = moves[i];
    const tiles = m.tiles.replace(/\./g, '');
    const moveStr = m.position ? `${m.position} ${tiles}` : tiles;
    const winPct = (m.win * 100).toFixed(2);
    const valuation = m.equity.toFixed(1);
    html += `<tr><td><b>${moveStr}</b></td><td>${m.score}</td><td>${m.leave || ''}</td><td>${winPct}</td><td>${valuation}</td></tr>`;
  }

  html += '</table></div>';
  container.innerHTML = html;
}
